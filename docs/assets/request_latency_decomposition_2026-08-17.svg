<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Milvus request latency decomposition map</title>
  <desc id="desc">A layered latency decomposition map for Milvus Insert, Load, Search, Query, and lazy-load paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="wait" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .section { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; filter: url(#softShadow); }
      .lane { fill: #ffffff; stroke: #d7dee8; stroke-width: 1; rx: 8; }
      .stage { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 7; }
      .mutedStage { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 7; }
      .hotStage { fill: #ecfdf5; stroke: #0f766e; stroke-width: 1.5; rx: 7; }
      .coldStage { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 7; }
      .waitStage { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; rx: 7; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
      .edgeSoft { fill: none; stroke: #94a3b8; stroke-width: 1.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .barBase { fill: #e2e8f0; rx: 5; }
      .metric { font: 700 12px Arial, sans-serif; fill: #ffffff; }
      .pillText { font: 700 12px Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="url(#bg)"/>

  <text x="52" y="56" class="title">Milvus Request Latency Decomposition</text>
  <text x="52" y="82" class="subtitle">Trace-centric view: separate control-plane lifecycle, physical object-store load, request-visible lazy wait, and hot QueryNode execution.</text>

  <g transform="translate(52 112)">
    <rect class="box" width="1296" height="198"/>
    <text x="24" y="32" class="section">1. End-to-end observable surface</text>
    <text x="24" y="55" class="small">The trace line is not one monolithic request timer. It is a set of span boundaries that must be interpreted by layer.</text>

    <g transform="translate(24 78)">
      <rect class="lane" x="0" y="0" width="238" height="86"/>
      <text x="16" y="25" class="label">Insert / Flush</text>
      <text x="16" y="48" class="small">serialize -> mq_produce</text>
      <text x="16" y="68" class="small">consume_lag -> s3_write</text>

      <rect class="lane" x="270" y="0" width="270" height="86"/>
      <text x="286" y="25" class="label">Load lifecycle</text>
      <text x="286" y="48" class="small">querycoord_submit -> load_start</text>
      <text x="286" y="68" class="small">load_complete / timeout / canceled</text>

      <rect class="lane" x="572" y="0" width="254" height="86"/>
      <text x="588" y="25" class="label">Physical LoadSegment</text>
      <text x="588" y="48" class="small">segment_cache_load / total_load</text>
      <text x="588" y="68" class="small">index, field, bloom, delta</text>

      <rect class="lane" x="858" y="0" width="220" height="86"/>
      <text x="874" y="25" class="label">Lazy wait</text>
      <text x="874" y="48" class="small">segment_cache_wait</text>
      <text x="874" y="68" class="small">miss / waiter / direct hit</text>

      <rect class="lane" x="1110" y="0" width="138" height="86"/>
      <text x="1126" y="25" class="label">Hot execution</text>
      <text x="1126" y="48" class="small">segment_search</text>
      <text x="1126" y="68" class="small">segment_query</text>

      <path class="edgeSoft" d="M238 43 L270 43"/>
      <path class="edgeSoft" d="M540 43 L572 43"/>
      <path class="edgeSoft" d="M826 43 L858 43"/>
      <path class="edgeSoft" d="M1078 43 L1110 43"/>
    </g>
  </g>

  <g transform="translate(52 338)">
    <rect class="box" width="1296" height="274"/>
    <text x="24" y="32" class="section">2. Search / Query critical-path waterfall</text>
    <text x="24" y="55" class="small">Read from left to right. Colored bars show what contributes to request-visible latency. 0ms hit/miss events are counters, not additive spans.</text>

    <g transform="translate(28 82)">
      <text x="0" y="24" class="label">Hot resident</text>
      <rect x="144" y="5" width="145" height="34" fill="url(#hot)" rx="7"/>
      <text x="160" y="27" class="metric">route</text>
      <rect x="309" y="5" width="198" height="34" fill="url(#hot)" rx="7"/>
      <text x="326" y="27" class="metric">segment_search/query</text>
      <rect x="527" y="5" width="174" height="34" fill="#0f766e" opacity="0.16" rx="7"/>
      <text x="545" y="27" class="pillText">reduce / merge</text>
      <path class="edge" d="M289 22 L309 22"/>
      <path class="edge" d="M507 22 L527 22"/>
    </g>

    <g transform="translate(28 138)">
      <text x="0" y="24" class="label">Cold miss</text>
      <rect x="144" y="5" width="105" height="34" fill="url(#cold)" rx="7"/>
      <text x="160" y="27" class="metric">route</text>
      <rect x="269" y="5" width="214" height="34" fill="url(#cold)" rx="7"/>
      <text x="286" y="27" class="metric">segment_cache_load</text>
      <rect x="503" y="5" width="388" height="34" fill="#fed7aa" rx="7"/>
      <text x="522" y="27" class="pillText">total_load: index + field + bloom + delta</text>
      <rect x="911" y="5" width="168" height="34" fill="#ea580c" opacity="0.18" rx="7"/>
      <text x="929" y="27" class="pillText">cache_wait = load wait</text>
      <rect x="1099" y="5" width="146" height="34" fill="#0f766e" opacity="0.82" rx="7"/>
      <text x="1114" y="27" class="metric">hot execution</text>
      <path class="edge" d="M249 22 L269 22"/>
      <path class="edge" d="M483 22 L503 22"/>
      <path class="edge" d="M891 22 L911 22"/>
      <path class="edge" d="M1079 22 L1099 22"/>
    </g>

    <g transform="translate(28 194)">
      <text x="0" y="24" class="label">Waiter</text>
      <rect x="144" y="5" width="105" height="34" fill="url(#wait)" rx="7"/>
      <text x="160" y="27" class="metric">route</text>
      <rect x="269" y="5" width="276" height="34" fill="url(#wait)" rx="7"/>
      <text x="288" y="27" class="metric">segment_cache_wait</text>
      <rect x="565" y="5" width="316" height="34" fill="#dbeafe" rx="7"/>
      <text x="584" y="27" class="pillText">other request performs segment_cache_load</text>
      <rect x="901" y="5" width="160" height="34" fill="#4f46e5" opacity="0.16" rx="7"/>
      <text x="919" y="27" class="pillText">hit counter</text>
      <rect x="1081" y="5" width="164" height="34" fill="#0f766e" opacity="0.82" rx="7"/>
      <text x="1098" y="27" class="metric">hot execution</text>
      <path class="edge" d="M249 22 L269 22"/>
      <path class="dash" d="M545 22 L565 22"/>
      <path class="edgeSoft" d="M881 22 L901 22"/>
      <path class="edge" d="M1061 22 L1081 22"/>
    </g>

    <g transform="translate(930 78)">
      <rect class="mutedStage" width="320" height="44"/>
      <text x="18" y="20" class="tiny">Decision rule</text>
      <text x="18" y="36" class="small">Direct hit = cache_miss=false AND waited_for_load=false</text>
      <rect class="mutedStage" y="54" width="320" height="44"/>
      <text x="18" y="74" class="tiny">Do not add</text>
      <text x="18" y="90" class="small">segment_cache_hit/miss are 0ms counters</text>
    </g>
  </g>

  <g transform="translate(52 640)">
    <rect class="box" width="1296" height="226"/>
    <text x="24" y="32" class="section">3. Analysis matrix</text>
    <text x="24" y="55" class="small">Use this matrix to turn raw logs into conclusions about lazy-load impact and optimization value.</text>

    <g transform="translate(24 78)">
      <rect class="stage" x="0" y="0" width="198" height="42"/>
      <text x="16" y="26" class="label">Path class</text>
      <rect class="stage" x="198" y="0" width="256" height="42"/>
      <text x="214" y="26" class="label">Primary trace evidence</text>
      <rect class="stage" x="454" y="0" width="262" height="42"/>
      <text x="470" y="26" class="label">Latency meaning</text>
      <rect class="stage" x="716" y="0" width="256" height="42"/>
      <text x="732" y="26" class="label">Optimization signal</text>
      <rect class="stage" x="972" y="0" width="252" height="42"/>
      <text x="988" y="26" class="label">Search / Query mapping</text>

      <rect class="hotStage" x="0" y="42" width="198" height="44"/>
      <text x="16" y="69" class="label">QueryNode has segment</text>
      <rect class="hotStage" x="198" y="42" width="256" height="44"/>
      <text x="214" y="69" class="small">segment_search / segment_query</text>
      <rect class="hotStage" x="454" y="42" width="262" height="44"/>
      <text x="470" y="69" class="small">Hot execution baseline</text>
      <rect class="hotStage" x="716" y="42" width="256" height="44"/>
      <text x="732" y="69" class="small">Compare against cold wait</text>
      <rect class="hotStage" x="972" y="42" width="252" height="44"/>
      <text x="988" y="69" class="small">Search or Query same shape</text>

      <rect class="coldStage" x="0" y="86" width="198" height="44"/>
      <text x="16" y="113" class="label">Current request loads</text>
      <rect class="coldStage" x="198" y="86" width="256" height="44"/>
      <text x="214" y="113" class="small">segment_cache_load + wait miss</text>
      <rect class="coldStage" x="454" y="86" width="262" height="44"/>
      <text x="470" y="113" class="small">Object-store load on critical path</text>
      <rect class="coldStage" x="716" y="86" width="256" height="44"/>
      <text x="732" y="113" class="small">Shared cache may help</text>
      <rect class="coldStage" x="972" y="86" width="252" height="44"/>
      <text x="988" y="113" class="small">trigger=Search / trigger=Query</text>

      <rect class="waitStage" x="0" y="130" width="198" height="44"/>
      <text x="16" y="157" class="label">Waits for loader</text>
      <rect class="waitStage" x="198" y="130" width="256" height="44"/>
      <text x="214" y="157" class="small">waited_for_load=true</text>
      <rect class="waitStage" x="454" y="130" width="262" height="44"/>
      <text x="470" y="157" class="small">No own load, but delayed</text>
      <rect class="waitStage" x="716" y="130" width="256" height="44"/>
      <text x="732" y="157" class="small">High concurrency amplification</text>
      <rect class="waitStage" x="972" y="130" width="252" height="44"/>
      <text x="988" y="157" class="small">Do not count as direct hit</text>
    </g>
  </g>

  <g transform="translate(52 884)">
    <rect x="0" y="-18" width="14" height="14" fill="#14b8a6" rx="3"/>
    <text x="22" y="-7" class="tiny">Hot execution</text>
    <rect x="136" y="-18" width="14" height="14" fill="#f97316" rx="3"/>
    <text x="158" y="-7" class="tiny">Cold object-store path</text>
    <rect x="328" y="-18" width="14" height="14" fill="#4f46e5" rx="3"/>
    <text x="350" y="-7" class="tiny">Wait-for-loader path</text>
    <rect x="526" y="-18" width="14" height="14" fill="#e2e8f0" rx="3"/>
    <text x="548" y="-7" class="tiny">Lifecycle / counter / untraced boundary</text>
  </g>
</svg>
